<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Morning Digest | 毎朝のAIニュースまとめ</title>
  <meta name="description" content="毎朝自動更新。通勤中や隙間時間にスマホでサクサク読めるAIニュース要約アプリ。">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* モバイルでのタップ感度向上とスクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 pb-16">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-400 flex items-center justify-center shadow-md shadow-indigo-500/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight leading-tight flex items-center gap-1.5">
            AI Morning Digest
            <span class="text-[10px] bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 font-semibold px-1.5 py-0.5 rounded-full">毎朝更新</span>
          </h1>
          <p id="header-date" class="text-xs text-slate-500 dark:text-slate-400">読み込み中...</p>
        </div>
      </div>
      
      <!-- Right Action Buttons -->
      <div class="flex items-center space-x-1.5">
        <button id="theme-toggle" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="テーマ切替">
          <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Category Tabs (Horizontal Scroll) -->
    <div class="max-w-2xl mx-auto px-4 pb-2.5 flex items-center gap-2 overflow-x-auto no-scrollbar" id="category-tabs">
      <!-- Generated by JS -->
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 pt-4 space-y-4">

    <!-- Progress / Read Status -->
    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-1">
      <div class="flex items-center gap-1.5">
        <i data-lucide="check-circle" class="w-3.5 h-3.5 text-emerald-500"></i>
        <span id="read-progress">読了状況: 0 / 0</span>
      </div>
      <button id="mark-all-read" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
        すべて既読にする
      </button>
    </div>

    <!-- AI Headline Summary Card -->
    <section class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-indigo-900 via-indigo-950 to-slate-900 text-white p-5 shadow-lg border border-indigo-700/30">
      <div class="absolute -top-12 -right-12 w-36 h-36 bg-indigo-500/20 rounded-full blur-2xl"></div>
      <div class="flex items-center gap-2 text-indigo-300 text-xs font-semibold tracking-wider uppercase mb-2">
        <i data-lucide="zap" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
        今日の30秒ハイライト
      </div>
      <p id="headline-summary" class="text-sm sm:text-base leading-relaxed text-indigo-100 font-medium">
        最新のAIニュースを取得中...
      </p>
    </section>

    <!-- Search Input -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
      <input 
        type="search" 
        id="search-input" 
        placeholder="キーワードで検索 (例: Claude, OpenAI, Cursor...)" 
        class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 transition-all shadow-sm"
      >
    </div>

    <!-- Articles List Container -->
    <section id="articles-list" class="space-y-3">
      <!-- Loading Skeleton -->
      <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/4"></div>
        <div class="h-5 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
        <div class="h-3 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
      </div>
    </section>

    <!-- Empty State (Hidden by default) -->
    <div id="empty-state" class="hidden text-center py-12 space-y-3">
      <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto text-slate-400">
        <i data-lucide="inbox" class="w-6 h-6"></i>
      </div>
      <p class="text-sm text-slate-500 dark:text-slate-400">該当する記事が見つかりませんでした</p>
    </div>

  </main>

  <script>
    // State
    let newsData = null;
    let currentCategory = 'すべて';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('ai_news_read') || '[]'));
    let bookmarkedArticles = new Set(JSON.parse(localStorage.getItem('ai_news_bookmarks') || '[]'));

    // Theme Management
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function initTheme() {
      const saved = localStorage.getItem('ai_news_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ai_news_theme', isDark ? 'dark' : 'light');
      themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    });

    initTheme();

    // Data Fetching
    async function loadData() {
      try {
        const res = await fetch('./data/latest.json?t=' + Date.now());
        if (!res.ok) throw new Error('Data fetch failed');
        newsData = await res.json();
        renderHeader();
        renderTabs();
        renderArticles();
      } catch (err) {
        console.error(err);
        document.getElementById('headline-summary').textContent = 'ニュースデータの読み込みに失敗しました。オフラインまたは更新待ちです。';
      }
    }

    function renderHeader() {
      if (!newsData) return;
      document.getElementById('header-date').textContent = ${newsData.date} 更新 ();
      document.getElementById('headline-summary').textContent = newsData.headline_summary;
    }

    function renderTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = '';
      
      const categories = [...(newsData?.categories || ['すべて']), '★ 保存済み'];
      categories.forEach(cat => {
        const btn = document.createElement('button');
        const isActive = currentCategory === cat;
        btn.className = px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ;
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          currentCategory = cat;
          renderTabs();
          renderArticles();
        });
        container.appendChild(btn);
      });
    }

    function getFilteredArticles() {
      if (!newsData || !newsData.articles) return [];
      let list = newsData.articles;

      if (currentCategory === '★ 保存済み') {
        list = list.filter(a => bookmarkedArticles.has(a.id));
      } else if (currentCategory !== 'すべて') {
        list = list.filter(a => a.category === currentCategory);
      }

      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        list = list.filter(a => 
          a.title.toLowerCase().includes(q) || 
          (a.summary_bullets && a.summary_bullets.some(b => b.toLowerCase().includes(q))) ||
          a.clean_desc.toLowerCase().includes(q)
        );
      }
      return list;
    }

    function renderArticles() {
      const container = document.getElementById('articles-list');
      const emptyState = document.getElementById('empty-state');
      const filtered = getFilteredArticles();

      // Update progress
      const allArticles = newsData?.articles || [];
      const readCount = allArticles.filter(a => readArticles.has(a.id)).length;
      document.getElementById('read-progress').textContent = 読了状況:  /  記事;

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map(art => {
        const isRead = readArticles.has(art.id);
        const isBookmarked = bookmarkedArticles.has(art.id);
        const bulletsHtml = (art.summary_bullets && art.summary_bullets.length > 0)
          ? art.summary_bullets.map(b => <li class="flex items-start gap-1.5 leading-snug"><span class="text-indigo-500 font-bold mt-0.5">•</span><span></span></li>).join('')
          : <p class="text-xs text-slate-500 dark:text-slate-400"></p>;

        return 
          <article class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm transition-all duration-200 ">
            <!-- Source & Category Header -->
            <div class="flex items-center justify-between text-[11px] font-medium mb-1.5">
              <span class="text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/60 px-2 py-0.5 rounded-md font-semibold">
                
              </span>
              <div class="flex items-center gap-2 text-slate-400 dark:text-slate-500">
                <span></span>
                <span>•</span>
                <span></span>
              </div>
            </div>

            <!-- Title -->
            <h2 class="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100 mb-2 leading-snug">
              <a href="" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                
              </a>
            </h2>

            <!-- 3-Bullet Summary -->
            <ul class="space-y-1 text-xs text-slate-600 dark:text-slate-300 mb-3 bg-slate-50/70 dark:bg-slate-800/40 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800/80">
              
            </ul>

            <!-- Action Bar -->
            <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800/60">
              <!-- Read toggle -->
              <button onclick="toggleRead('')" class="flex items-center gap-1 text-xs ">
                <i data-lucide="" class="w-4 h-4"></i>
                <span></span>
              </button>

              <div class="flex items-center gap-1">
                <!-- Bookmark -->
                <button onclick="toggleBookmark('')" class="p-1.5 rounded-lg text-slate-400 hover:text-amber-500 dark:hover:text-amber-400 transition-colors" title="保存">
                  <i data-lucide="bookmark" class="w-4 h-4 "></i>
                </button>
                
                <!-- Share -->
                <button onclick="shareArticle('', '')" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors" title="共有">
                  <i data-lucide="share-2" class="w-4 h-4"></i>
                </button>

                <!-- Link to Source -->
                <a href="" target="_blank" rel="noopener noreferrer" class="flex items-center gap-0.5 text-xs text-indigo-600 dark:text-indigo-400 font-medium pl-1.5 hover:underline">
                  <span>記事へ</span>
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
              </div>
            </div>
          </article>
        ;
      }).join('');

      lucide.createIcons();
    }

    // Toggle Read
    window.toggleRead = function(id) {
      if (readArticles.has(id)) {
        readArticles.delete(id);
      } else {
        readArticles.add(id);
      }
      localStorage.setItem('ai_news_read', JSON.stringify(Array.from(readArticles)));
      renderArticles();
    };

    // Toggle Bookmark
    window.toggleBookmark = function(id) {
      if (bookmarkedArticles.has(id)) {
        bookmarkedArticles.delete(id);
      } else {
        bookmarkedArticles.add(id);
      }
      localStorage.setItem('ai_news_bookmarks', JSON.stringify(Array.from(bookmarkedArticles)));
      renderArticles();
    };

    // Mark all as read
    document.getElementById('mark-all-read').addEventListener('click', () => {
      if (!newsData || !newsData.articles) return;
      newsData.articles.forEach(a => readArticles.add(a.id));
      localStorage.setItem('ai_news_read', JSON.stringify(Array.from(readArticles)));
      renderArticles();
    });

    // Share API
    window.shareArticle = function(title, url) {
      if (navigator.share) {
        navigator.share({
          title: title,
          text: 【AI Morning】,
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(${title} ).then(() => {
          alert('URLをクリップボードにコピーしました！');
        });
      }
    };

    // Search filter
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderArticles();
    });

    // Utilities
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(isoStr) {
      if (!isoStr) return '';
      try {
        const dt = new Date(isoStr);
        const m = (dt.getMonth() + 1).toString().padStart(2, '0');
        const d = dt.getDate().toString().padStart(2, '0');
        const h = dt.getHours().toString().padStart(2, '0');
        const min = dt.getMinutes().toString().padStart(2, '0');
        return ${m}/ :;
      } catch {
        return '';
      }
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }

    // Initial load
    loadData();
  </script>
</body>
</html>
